# Supabase local development configuration
# https://supabase.com/docs/guides/cli/config
#
# The project_id should match the linked remote project's ref (replace before
# running `supabase link`). All other defaults are kept conservative so a
# `supabase start` works out of the box for offline migration testing.

project_id = "nexus-editorial"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = false

[edge_runtime]
enabled = true
# Permet d'invoquer les Edge Functions en local via `supabase functions serve`.
# Les 11 functions sont auto-découvertes dans supabase/functions/*/index.ts.
# Déploiement prod : `supabase functions deploy <name>` (cf. HANDOFF_EDGE_FUNCTIONS.md).
inspector_port = 8083

[functions.agent-3-post-analysis]
verify_jwt = false  # Auth gérée par notre bearer NEXUS_API_TOKEN.

[functions.agent-4-linkedin-trends]
verify_jwt = false

[functions.agent-5-insurance-trends]
verify_jwt = false

[functions.agent-6-angles-generator]
verify_jwt = false

[functions.agent-7-editorial-director]
verify_jwt = false

[functions.agent-8-visual-decision]
verify_jwt = false

[functions.agent-9-timing-recommendation]
verify_jwt = false

[functions.collect-and-normalize]
verify_jwt = false

[functions.notify-weekly-report]
verify_jwt = false

[analytics]
enabled = false
